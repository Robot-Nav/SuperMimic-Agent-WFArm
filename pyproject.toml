[project]
name = "SuperMimic-Agent-WFArm"
version = "0.1.0"
description = "Exploratory wheel-legged manipulation with differentiable world models, BPTT, and agent-generated references."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = ["torch>=2.5,<3", "numpy>=1.26,<3", "mujoco>=3.10,<4", "scipy>=1.11,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
media = ["imageio>=2.30,<3", "imageio-ffmpeg>=0.5,<1", "matplotlib>=3.8,<4"]
teacher = ["osqp>=0.6.7,<0.7", "quadprog>=0.1.13,<0.2"]
# The inherited G1 implementation has a separate GPU dependency stack.
g1 = [
  "mjlab @ git+https://github.com/mujocolab/mjlab@8bb2bc9e187797689ec82c78c35019afd2fd0376",
  "torch>=2.14,<3", "warp-lang>=1.15", "mujoco-warp~=3.16.0", "mujoco~=3.16.0",
  "tensorboard>=2.20", "tyro>=1.0.1", "huggingface-hub>=0.30", "pandas", "pyarrow", "tqdm",
]

[project.urls]
Repository = "https://github.com/Robot-Nav/SuperMimic-Agent-WFArm"
Issues = "https://github.com/Robot-Nav/SuperMimic-Agent-WFArm/issues"

[project.scripts]
sm-train = "supermimic.scripts.train:main"
sm-wf-train = "supermimic.wf.train:main"
sm-wf-eval = "supermimic.wf.evaluate:main"
sm-mimicagent = "supermimic.mimicagent.pipeline:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supermimic"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests", "private_assets: needs separately supplied robot assets"]

[tool.ruff]
line-length = 100
target-version = "py311"
